<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essays on Political Caderism — Mutale Mwenya</title>
<meta name="description" content="A monograph on political violence in Zambia, by Mutale Mwenya. Mockingbird Publishers Limited.">
<style>
:root{--orange:#C85A17;--cream:#FFF8EA;--ink:#000;--line:#E08A4F}
*{box-sizing:border-box}
body{margin:0;background:var(--orange);color:var(--cream);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:880px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:48px;align-items:center}
img{width:100%;height:auto;display:block;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.label{font:700 11px/1 Helvetica,Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
h1{font-size:2.6rem;line-height:1.05;margin:.6rem 0 .2rem;color:var(--ink)}
.sub{font-style:italic;font-size:1.15rem;margin:0 0 1.2rem}
hr{border:0;border-top:1px solid var(--cream);width:90px;margin:1.4rem 0}
.author{font:700 12px/1 Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:1.6rem}
a.btn{font:700 12px/1 Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:14px 18px;border:1px solid var(--cream);color:var(--cream)}
a.btn.primary{background:var(--ink);border-color:var(--ink)}
a.btn:hover,a.btn:focus{background:var(--cream);color:var(--ink);border-color:var(--cream)}
footer{max-width:880px;margin:0 auto;padding:0 24px 40px;font:11px/1.6 Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
@media(max-width:700px){main{grid-template-columns:1fr;gap:32px}img{max-width:280px;margin:0 auto}}
</style>
</head>
<body>
<main>
  <img src="assets/cover.png" alt="Cover of Essays on Political Caderism">
  <section>
    <div class="label">A Monograph · Zambian Political Thought</div>
    <h1>Essays on Political Caderism</h1>
    <p class="sub">A Psycho-Political Analysis of Political Violence in Zambia</p>
    <hr>
    <div class="author">Mutale Mwenya</div>
    <div class="btns">
      <a class="btn primary" href="pdfs/Essays_on_Political_Caderism-Monograph.pdf">Read the monograph (PDF)</a>
      <a class="btn" href="pdfs/Political_Caderism-Proposal-Updated_Version.pdf">Book proposal (PDF)</a>
    </div>
  </section>
</main>
<footer>Mockingbird Publishers Limited · All rights reserved</footer>
</body>
</html>
